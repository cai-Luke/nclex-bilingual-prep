name: Promotion Gate

on:
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Run audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Test topic population
        run: npm run test:topic-population

      - name: Test topic-license detector regression
        run: npm run test:topic-license

      - name: Test topic vocabulary
        run: npm run test:topic-vocabulary

      - name: Check topic-vocabulary export drift
        run: |
          TMP_TOPIC_VOCAB="$(mktemp)"
          npx --no-install tsx scripts/export-topic-vocab.ts "$TMP_TOPIC_VOCAB"
          cmp -s docs/topic-vocabulary.md "$TMP_TOPIC_VOCAB" || {
            echo "docs/topic-vocabulary.md is stale; run npm run export-topic-vocab and commit the result."
            diff -u docs/topic-vocabulary.md "$TMP_TOPIC_VOCAB" || true
            exit 1
          }

      - name: Test visuals
        run: npm run test-visuals

      - name: Run promotion gate
        run: npm run audit

      - name: Test sweep validator
        run: npm run test:validate-sweep

      - name: Test non-MCQ bias audit and Layer B handoff
        run: npm run test:non-mcq-bias

      - name: Test bank schema invariants
        run: npm run test:schema-bank

      - name: Test structured-measurement staging and application
        run: |
          npm run test:flowsheet-gate
          npm run test:structured-measurements
          npm run test:structured-measurements-applicator

      - name: Test coverage targeting
        run: npm run test:coverage-report

      - name: Check census drift
        run: npm run census:check

      - name: Test DECISIONS format and repository conformance
        run: |
          npm run test:decisions-format
          npm run conform:decisions
